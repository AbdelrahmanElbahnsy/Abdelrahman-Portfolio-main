    <!-- Theme Initialization to Prevent FOUC for Public Portfolio ONLY -->
    <script>
      (function() {
        try {
          // AdminOS paths start with /admin
          if (window.location.pathname.startsWith('/admin')) {
            return;
          }

          var cacheStr = localStorage.getItem('portfolio-appearance-cache');
          var theme = 'dark';
          var lang = 'en';

          if (cacheStr) {
            try {
              var cache = JSON.parse(cacheStr);
              if (cache.theme) theme = cache.theme;
              if (cache.language) lang = cache.language;
            } catch (e) {}
          } else {
            // Fallback for first-time visitors
            var legacyTheme = localStorage.getItem('portfolio-theme');
            if (legacyTheme === 'light') theme = 'light';
            var legacyLang = localStorage.getItem('portfolio-language');
            if (legacyLang === 'ar') lang = 'ar';
          }
          
          // We apply the FOUC settings to the #root temporarily.
          // The React app will override this properly on .portfolio-theme-root inside #root.
          var rootEl = document.getElementById('root');
          if (rootEl) {
            if (theme === 'light') {
              rootEl.setAttribute('data-portfolio-theme', 'light');
            }
            if (lang === 'ar') {
              rootEl.setAttribute('dir', 'rtl');
            } else {
              rootEl.setAttribute('dir', 'ltr');
            }
          }
        } catch (e) {}
      })();
    </script>
