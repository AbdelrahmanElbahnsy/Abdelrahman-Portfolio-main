    <!-- Theme Initialization to Prevent FOUC -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('portfolio-theme');
          if (theme === 'light') {
            document.documentElement.classList.add('light-theme');
          } else if (theme !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.classList.add('light-theme');
          }
          
          var lang = localStorage.getItem('portfolio-language');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
            // IMPORTANT: dir MUST remain 'ltr' at all times.
            // Structural layout depends on LTR. RTL is applied locally to text only.
            document.documentElement.dir = 'ltr';
          } else {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
